<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }
        .header-bar {
            width: 100%;
            height: 15px;
            background-color: #FF5A00;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Reduced bottom padding and vertical gaps to lower total height */
        .content-wrapper {
            padding: 80px 64px 20px 64px; /* keep top padding (80px) */
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 24px; /* reduced from 40px */
            height: 100%;
        }
        .text-column {
            grid-column: span 4;
            display: flex;
            flex-direction: column;
        }
        .image-column {
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-title {
            color: #0B1D3A;
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 20px; /* keep this to preserve title spacing */
            line-height: 1.2;
        }
        .divider {
            width: 100%;
            height: 2px;
            background-color: #0B1D3A;
            margin-bottom: 16px; /* reduced from 40px */
        }
        .point-container {
            margin-bottom: 16px; /* reduced from 30px */
            position: relative;
            padding-left: 30px;
        }
        .point-container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px; /* slightly adjusted */
            width: 12px;
            height: 12px;
            background-color: #FF5A00;
        }
        .point-title {
            color: #0B1D3A;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .point-text {
            color: #708090;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.5;
        }
        .highlight-box {
            margin-top: 16px; /* reduced from 40px */
            border-left: 8px solid #FF5A00;
            padding: 12px 20px; /* reduced padding */
            background-color: rgba(255, 90, 0, 0.05);
        }
        .highlight-text {
            color: #FF5A00;
            font-size: 28px;
            font-weight: 800;
            font-style: italic;
        }
        /* Reduced image height so it doesn't force overflow */
        .scale-image {
            width: 100%;
            height: 420px; /* reduced from 500px */
            object-fit: contain;
            border: 2px solid #0B1D3A;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar"></div>
        <div class="content-wrapper">
            <div class="text-column">
                <h2 class="slide-title">มาตราส่วนเล็ก เปลี่ยนคำตอบใหญ่</h2>
                <div class="divider"></div>
                
                <div class="point-container">
                    <div class="point-title">นิยามระดับนาโน</div>
                    <div class="point-text">ช่วงขนาด 1–100 นาโนเมตร (10⁻⁹ เมตร)</div>
                </div>
                
                <div class="point-container">
                    <div class="point-title">อัตราส่วนพื้นที่ผิวต่อปริมาตร</div>
                    <div class="point-text">ขนาดลดลง → พื้นที่ผิวต่อปริมาตรเพิ่ม ส่งผลต่อการทำปฏิกิริยา</div>
                </div>
                
                <div class="point-container">
                    <div class="point-title">สมบัติที่เปลี่ยนไป</div>
                    <div class="point-text">คุณสมบัติทางแสง ไฟฟ้า แม่เหล็ก และเคมีต่างจากวัสดุแบบ Bulk</div>
                </div>
                
                <div class="highlight-box">
                    <div class="highlight-text">"สมบัติเปลี่ยนเพราะอะไร และหลักฐานใดบอกเรา?"</div>
                </div>
            </div>
            <div class="image-column">
                <img src="/home/ubuntu/upload/search_images/3crTfl1iZnZ8.jpg" alt="Nanoscale Comparison" class="scale-image">
            </div>
        </div>
    </div>
</body>
</html>
